<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in — CEO Dashboard</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="mark">C</div>
    <h1>Welcome back</h1>
    <p class="sub">Log in to your CEO dashboard.</p>
    <div class="auth-error" id="error"></div>
    <form class="auth-form" id="login-form">
      <label>Email
        <input type="email" name="email" placeholder="you@business.com" required />
      </label>
      <label>Password
        <input type="password" name="password" placeholder="Password" required />
      </label>
      <button class="btn primary" type="submit">Log in</button>
    </form>
    <div class="auth-switch">Don't have a workspace yet? <a href="/signup.html">Sign up</a></div>
  </div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('error');
  errorBox.classList.remove('show');
  const data = Object.fromEntries(new FormData(e.target).entries());
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || 'Login failed');
    }
    window.location.href = '/';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
  }
});
</script>
</body>
</html>
